# Research Hub — production stack (Portainer-friendly).
#
#   docker compose up -d --build
#
# In Portainer: add a Stack from this repository (or paste this file), set the
# environment variables in the UI, and deploy. All knobs are env vars below.

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${HUB_IMAGE:-research-hub:latest}
    # This image is built locally from the Dockerfile, not pulled from a
    # registry. "build" tells Compose to build it and never attempt a pull.
    pull_policy: build
    container_name: ${HUB_CONTAINER_NAME:-research-hub}
    restart: ${HUB_RESTART:-unless-stopped}
    ports:
      - "${HUB_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      RESEARCH_HUB_TITLE: ${RESEARCH_HUB_TITLE:-Research Hub}
      RESEARCH_HUB_DATA_DIR: /app/data
      RESEARCH_HUB_FRONTEND_DIST: /app/frontend/dist
      RESEARCH_HUB_CORS_ORIGINS: ${RESEARCH_HUB_CORS_ORIGINS:-*}
    volumes:
      # Named volume for datasets. On first deploy Docker auto-seeds it with the
      # CSVs bundled in the image, so the hub is populated out of the box.
      # Add more CSVs via Portainer: Volumes -> hub_data -> Browse -> Upload.
      # (To use a host folder instead, replace the line below with:
      #   - /absolute/path/on/host:/app/data )
      - hub_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # Helps identify the stack in Portainer.
      com.research-hub.service: "hub"

volumes:
  hub_data:
