# Research Hub — development stack with hot reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Frontend (Vite) is served on http://localhost:5173 and proxies /api to the
# backend. Both services live-reload from the mounted source.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-base
    container_name: ${HUB_CONTAINER_NAME:-research-hub}-backend-dev
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend
    ports:
      - "${HUB_API_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      RESEARCH_HUB_TITLE: ${RESEARCH_HUB_TITLE:-Research Hub (dev)}
      RESEARCH_HUB_DATA_DIR: /app/data
      # No built frontend in dev — Vite serves it. Point at a path that won't exist.
      RESEARCH_HUB_FRONTEND_DIST: /app/frontend/dist
      RESEARCH_HUB_CORS_ORIGINS: ${RESEARCH_HUB_CORS_ORIGINS:-*}
    volumes:
      - ./backend:/app/backend
      - ${HUB_DATA_PATH:-./data}:/app/data

  frontend:
    image: node:22-alpine
    container_name: ${HUB_CONTAINER_NAME:-research-hub}-frontend-dev
    restart: unless-stopped
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${HUB_WEB_PORT:-5173}:5173"
    environment:
      # Proxy API calls to the backend service inside the compose network.
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      # Keep container node_modules separate from the host.
      - hub_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  hub_node_modules:
