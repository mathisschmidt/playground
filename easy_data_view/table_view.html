<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Dashboard</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #e2e8f0;
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #2d3554;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: #3b4368;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
         }

        .badge {
            background: #22c55e20;
            color: #22c55e;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid #2d3554;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #1e2640;
            font-size: 0.95rem;
        }

        tr:hover td {
            background: #1e2640;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active {
            background: #22c55e;
        }

        .status-pending {
            background: #eab308;
        }

        .status-inactive {
            background: #64748b;
        }

        .metric-value {
            font-weight: 600;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        button {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-delete {
            background: #dc262620;
            color: #ef4444;
            border: 1px solid #dc262640;
        }

        .btn-delete:hover {
            background: #dc2626;
            color: #fff;
        }

        .btn-add {
            background: #8b5cf6;
            color: #fff;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        .add-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 0.75rem;
            margin-bottom: 1rem;
            align-items: end;
        }

        input, select {
            background: #0a0e27;
            border: 1px solid #2d3554;
            border-radius: 6px;
            padding: 0.6rem;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 968px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .add-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="dashboard" x-data="table()">

    <div class="grid">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Recent Activity</h2>
            </div>

            <form id="table-form" class="add-form">
                <template x-for="column in tableInfos.columns" :key="column.name">
                    <div class="form-group" x-show="column.showInTable">
                        <label :for="column.name" x-text="column.label"></label>
                        <template x-if="column.type.isTextType()">
                            <input :id="column.name" :type="column.type.value" x-model="newItem[column.name]" :placeholder="'Enter ' + column.label.toLowerCase()">
                        </template>
                        <template x-if="column.type.isNumberType()">
                            <input :id="column.name" type="number" x-model="newItem[column.name]" :placeholder="0">
                        </template>
                        <template x-if="column.type.isSelectType()">
                            <select :id="column.name" x-model="newItem[column.name]">
                                <template x-for="option in column.options" :key="option.value">
                                    <option :value="option.value" x-text="option.label"></option>
                                </template>
                            </select>
                        </template>
                    </div>
                </template>
                <button type="button" class="btn-add" @click="addRow()">Add</button>
            </form>

            <table>
                <thead>
                <tr>
                    <template x-for="col in tableInfos.columns" :key="col.name">
                        <th x-show="col.showInTable" x-text="col.label"></th>
                    </template>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="item in tableInfos.data" :key="item.id">
                    <tr>
                        <!-- Render cells in the same order as tableInfos.columns so form, headers and data align -->
                        <template x-for="col in tableInfos.columns" :key="col.name">
                            <td x-show="col.showInTable" x-text="item[col.name]"></td>
                        </template>
                        <td>
                            <div class="actions">
                                <button class="btn-delete" @click="tableInfos.removeRow(item)">Delete</button>
                            </div>
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    class InputType {
        // Text inputs
        static TEXT = new InputType('text', 'Text', 'text');
        static PASSWORD = new InputType('password', 'Password', 'text');
        static EMAIL = new InputType('email', 'Email', 'text');
        static SEARCH = new InputType('search', 'Search', 'text');
        static TEL = new InputType('tel', 'Telephone', 'text');
        static URL = new InputType('url', 'URL', 'text');

        // Number inputs
        static NUMBER = new InputType('number', 'Number', 'number');
        static RANGE = new InputType('range', 'Range', 'number');

        // Date/Time inputs
        static DATE = new InputType('date', 'Date', 'date');
        static DATETIME_LOCAL = new InputType('datetime-local', 'Date & Time', 'date');
        static TIME = new InputType('time', 'Time', 'date');
        static WEEK = new InputType('week', 'Week', 'date');
        static MONTH = new InputType('month', 'Month', 'date');

        // Selection inputs
        static SELECT = new InputType('select', 'Select', 'selection');
        static CHECKBOX = new InputType('checkbox', 'Checkbox', 'selection');
        static RADIO = new InputType('radio', 'Radio', 'selection');

        // File input
        static FILE = new InputType('file', 'File', 'file');

        // Color picker
        static COLOR = new InputType('color', 'Color', 'color');

        // Buttons
        static BUTTON = new InputType('button', 'Button', 'button');
        static SUBMIT = new InputType('submit', 'Submit', 'button');
        static RESET = new InputType('reset', 'Reset', 'button');
        static IMAGE = new InputType('image', 'Image', 'button');

        // Hidden
        static HIDDEN = new InputType('hidden', 'Hidden', 'hidden');

        constructor(value, label, category) {
            this.value = value;
            this.label = label;
            this.category = category;
        }

        isTextType() {
            return this.category === 'text';
        }

        isNumberType() {
            return this.category === 'number';
        }

        isDateType() {
            return this.category === 'date';
        }

        isSelectType() {
            return this.value === InputType.SELECT.value;
        }

        isSelectionType() {
            return this.category === 'selection';
        }

        isButtonType() {
            return this.category === 'button';
        }

        static values() {
            return [
                InputType.TEXT, InputType.PASSWORD, InputType.EMAIL, InputType.SEARCH,
                InputType.TEL, InputType.URL, InputType.NUMBER, InputType.RANGE,
                InputType.DATE, InputType.DATETIME_LOCAL, InputType.TIME,
                InputType.WEEK, InputType.MONTH, InputType.CHECKBOX, InputType.RADIO,
                InputType.FILE, InputType.COLOR, InputType.BUTTON, InputType.SUBMIT,
                InputType.RESET, InputType.IMAGE, InputType.HIDDEN
            ];
        }

        static fromValue(value) {
            return InputType.values().find(type => type.value === value);
        }

        static getByCategory(category) {
            return InputType.values().filter(type => type.category === category);
        }
    }

    class ColumnInfo {
        constructor(name, label, type = InputType.TEXT, sortable = false, searchable = false, showInTable = true, options = [], autoIncrement = false,) {
            this.name = name;
            this.label = label;
            this.type = type;
            this.sortable = sortable;
            this.searchable = searchable;
            this.showInTable = showInTable;
            this.options = options; // For select, radio, checkbox types
            this.autoIncrement = autoIncrement;
        }
    }

    /*TODO: add a checker for check that a columns is a type ColumnInfo*/
    /*TODO: find a way to manage the ID (all data will always have ID so we can make a global solution)*/
    class TableInfos {
        constructor(columns = [], data = []) {
            this.columns = columns;
            this.data = data;
            // Keep columns ordered by name so UI (form, headers, rows) stays consistent
            this.sortColumns();
            this.validateDataStructure(false)
        }

         // Sort columns alphabetically by name
         sortColumns() {
             this.columns.sort((a, b) => a.name.localeCompare(b.name));
         }

        get columnNames() {
            return this.columns.map(col => col.name);
        }

        columnHaveToBeShow(colName) {
            const col = this.columns.find(c => c.name === colName);
            return col ? col.showInTable : false;
        }

        validateDataStructure(applyAutoIncrement = true) {
            if (this.data.length === 0) return;
            this.data.forEach(row =>
                this.validateRow(row, applyAutoIncrement)
            );
        }

        validateRow(row, applyAutoIncrement = true) {
            // TODO: check row is a dictionary
            // TODO: Maybe this logic can be in the columns class
            Object.entries(row).forEach(([key, value]) => {
                let columnDef = this.columns.find(col => col.name === key);

                if (!columnDef) {
                    throw new Error(`Column ${key} does not exist in column definitions`);
                }

                if (applyAutoIncrement && columnDef.autoIncrement) {
                    let maxId = this.data.reduce((max, r) => r[key] > max ? r[key] : max, 0);
                    row[key] = maxId + 1;
                }
            });

            let notFoundKeys = this.columnNames.filter(colName => !Object.keys(row).includes(colName));
            if (notFoundKeys.length > 0) {
                throw new Error(`Row is missing keys: ${notFoundKeys}`);
            }
        }

        initNewItem() {
            let newItem = {};
            this.columns.forEach(col => {
                newItem[col.name] = null;
            });
            return newItem;
        }

        addRow(row) {
            this.validateRow(row)
            this.data.push(row);
        }

        removeRow(item) {
            const index = this.data.findIndex(item =>
                Object.entries(item).every(([key, value]) => item[key] === value)
            );

            if (index !== -1) {
                this.data.splice(index, 1);
            } else {
                throw new Error(`Row not found in data`);
            }
        }

        updateRow(index, newRow) {
         // TODO: be done later
        }

        addColumn(column, defaultValue = null) {
            if (!this.columnNames.includes(column.name)) {
                this.columns.push(column);
                // keep the column list sorted after adding
                this.sortColumns();
                this.data.forEach(row => {
                    row[column.name] = defaultValue;
                });
            } else {
                throw new Error('Column with this name already exists');
            }
        }
    }



    function table() {
        return {
            newItem: {},
            tableInfos: new TableInfos(
                [
                    new ColumnInfo('id', 'ID', InputType.NUMBER, true, true, true, [], true),
                    new ColumnInfo('user', 'User', InputType.TEXT, true, true),
                    new ColumnInfo('status', 'Status', InputType.SELECT, true, true, true, [
                        { value: 'active', label: 'Active' },
                        { value: 'pending', label: 'Pending' },
                        { value: 'inactive', label: 'Inactive' }
                    ]),
                    new ColumnInfo('amount', 'Amount', InputType.NUMBER, true, false)
                ],
                [
                    { id: 1, user: 'John Doe', status: 'active', amount: 2450 },
                    { id: 2, user: 'Sarah Smith', status: 'active', amount: 1890 },
                    { id: 3, user: 'Mike Johnson', status: 'pending', amount: 3200 },
                    { id: 4, user: 'Emily Brown', status: 'active', amount: 4120 },
                    { id: 5, user: 'David Lee', status: 'inactive', amount: 890 }
                ]
            ),
            addRow() {
                this.tableInfos.addRow(this.newItem);  // Just pass the object directly
                this.newItem = this.tableInfos.initNewItem();
            },
            init() {
                this.newItem = this.tableInfos.initNewItem();
            },
        }
    }
</script>
</body>
</html>
