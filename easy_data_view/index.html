<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Dashboard</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #e2e8f0;
            padding: 2rem;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #2d3554;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: #3b4368;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .badge {
            background: #22c55e20;
            color: #22c55e;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid #2d3554;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #1e2640;
            font-size: 0.95rem;
        }

        tr:hover td {
            background: #1e2640;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active {
            background: #22c55e;
        }

        .status-pending {
            background: #eab308;
        }

        .status-inactive {
            background: #64748b;
        }

        .metric-value {
            font-weight: 600;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        button {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-delete {
            background: #dc262620;
            color: #ef4444;
            border: 1px solid #dc262640;
        }

        .btn-delete:hover {
            background: #dc2626;
            color: #fff;
        }

        .btn-add {
            background: #8b5cf6;
            color: #fff;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        .add-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 0.75rem;
            margin-bottom: 1rem;
            align-items: end;
        }

        input, select {
            background: #0a0e27;
            border: 1px solid #2d3554;
            border-radius: 6px;
            padding: 0.6rem;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 968px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .add-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="dashboard" x-data="dashboard()">
    <div class="header">
        <h1>Title Dashboard</h1>
        <p class="subtitle">Description view. Real-time metrics and data visualization</p>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Revenue Overview</h2>
                <span class="badge">+12.5%</span>
            </div>
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Recent Activity</h2>
            </div>

            <div class="add-form">
                <div class="form-group">
                    <label>User Name</label>
                    <input type="text" x-model="newItem.user" placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select x-model="newItem.status">
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" x-model="newItem.amount" placeholder="0">
                </div>
                <button class="btn-add" @click="addItem()">Add</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th>User</th>
                    <th>Status</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="item in tableData" :key="item.id">
                    <tr>
                        <td x-text="item.user"></td>
                        <td>
                  <span class="status">
                    <span class="status-dot" :class="'status-' + item.status"></span>
                    <span x-text="item.statusText"></span>
                  </span>
                        </td>
                        <td class="metric-value" x-text="'$' + item.amount.toLocaleString()"></td>
                        <td>
                            <div class="actions">
                                <button class="btn-delete" @click="deleteItem(item.id)">Delete</button>
                            </div>
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function dashboard() {
        return {
            chart: null,
            chartData: [12000, 19000, 15000, 25000, 22000, 30000],
            tableData: [
                { id: 1, user: 'John Doe', status: 'active', statusText: 'Active', amount: 2450 },
                { id: 2, user: 'Sarah Smith', status: 'active', statusText: 'Active', amount: 1890 },
                { id: 3, user: 'Mike Johnson', status: 'pending', statusText: 'Pending', amount: 3200 },
                { id: 4, user: 'Emily Brown', status: 'active', statusText: 'Active', amount: 4120 },
                { id: 5, user: 'David Lee', status: 'inactive', statusText: 'Inactive', amount: 890 }
            ],
            newItem: {
                user: '',
                status: 'active',
                amount: ''
            },

            init() {
                this.initChart();
            },

            initChart() {
                const ctx = document.getElementById('revenueChart').getContext('2d');
                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                        datasets: [{
                            label: 'Revenue',
                            data: this.chartData,
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: '#8b5cf6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: '#1a1f3a',
                                titleColor: '#fff',
                                bodyColor: '#e2e8f0',
                                borderColor: '#2d3554',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: '#2d3554',
                                    drawBorder: false
                                },
                                ticks: {
                                    color: '#64748b',
                                    callback: function(value) {
                                        return '$' + value.toLocaleString();
                                    }
                                }
                            },
                            x: {
                                grid: {
                                    display: false,
                                    drawBorder: false
                                },
                                ticks: {
                                    color: '#64748b'
                                }
                            }
                        }
                    }
                });
            },

            addItem() {
                if (!this.newItem.user || !this.newItem.amount) {
                    alert('Please fill in all fields');
                    return;
                }

                const statusMap = {
                    active: 'Active',
                    pending: 'Pending',
                    inactive: 'Inactive'
                };

                const newId = Math.max(...this.tableData.map(item => item.id), 0) + 1;

                this.tableData.push({
                    id: newId,
                    user: this.newItem.user,
                    status: this.newItem.status,
                    statusText: statusMap[this.newItem.status],
                    amount: parseFloat(this.newItem.amount)
                });

                this.updateChart();

                this.newItem = {
                    user: '',
                    status: 'active',
                    amount: ''
                };
            },

            deleteItem(id) {
                this.tableData = this.tableData.filter(item => item.id !== id);
                this.updateChart();
            },

            updateChart() {
                const totalAmount = this.tableData.reduce((sum, item) => sum + item.amount, 0);
                const avgAmount = totalAmount / 6;

                this.chartData = Array.from({ length: 6 }, (_, i) => {
                    return Math.round(avgAmount * (0.8 + Math.random() * 0.4));
                });

                this.chart.data.datasets[0].data = this.chartData;
                this.chart.update();
            }
        }
    }
</script>
</body>
</html>
